<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .brand-title { font-family: 'Impact', 'Arial Black', sans-serif; font-weight: 900; }
      .brand-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: 6px; }
      .group-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 3px; fill: #c59b27; text-transform: uppercase; }
    </style>
    <filter id="brushFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" />
    </filter>
  </defs>

  <g transform="translate(10, 15)">
    <!-- LEFT: Group of Gowda's Umbrella Emblem -->
    <g transform="translate(10, 5)">
      <!-- Umbrella Top Spike -->
      <path d="M 65,15 L 65,2" stroke="#FF4500" stroke-width="6" stroke-linecap="round" />

      <!-- Umbrella Canopy -->
      <path d="M 8,72 C 18,34 42,16 65,16 C 88,16 112,34 122,72 C 105,60 92,68 78,63 C 68,55 60,55 50,63 C 36,68 24,60 8,72 Z" 
            fill="#FF4500" />
      
      <!-- Inner Scallops -->
      <path d="M 12,70 Q 30,58 48,68 Q 65,56 82,68 Q 100,58 118,70" 
            stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Shaft & J-Hook Handle -->
      <path d="M 65,60 L 65,130" stroke="#FF4500" stroke-width="8" stroke-linecap="round" />
      <path d="M 65,130 C 65,152 42,152 42,134" stroke="#FF4500" stroke-width="8" stroke-linecap="round" fill="none" />

      <!-- Group of Gowda's Small Badge -->
      <text x="65" y="165" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" letter-spacing="1.5" fill="#1e293b">GROUP OF GOWDA'S</text>
    </g>

    <!-- Vertical Divider -->
    <line x1="150" y1="20" x2="150" y2="150" stroke="#c59b27" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />

    <!-- RIGHT: OM MURUGA HOLIDAYS -->
    <g transform="translate(170, 0)">
      <!-- Top Group Endorsement -->
      <text x="5" y="24" class="group-sub">★ PREMIUM HOSPITALITY &amp; STAYS ★</text>

      <!-- Main "OM MURUGA" Letters -->
      <g transform="translate(0, 15)" filter="url(#brushFilter)">
        <!-- OM (Bright Red) -->
        <g fill="#E50914">
          <!-- O -->
          <path d="M 15,92 C 5,78 4,36 18,24 C 32,12 54,14 60,26 C 66,38 66,78 56,94 C 48,104 24,102 15,92 Z M 28,84 C 32,88 42,88 44,80 C 48,70 50,38 42,30 C 38,26 30,28 28,34 C 24,44 24,74 28,84 Z" />
          <!-- M -->
          <path d="M 72,100 L 80,20 L 94,18 L 108,60 L 122,18 L 136,20 L 130,100 L 114,100 L 118,50 L 106,82 L 96,82 L 84,50 L 86,100 Z" />
        </g>

        <!-- MURUGA -->
        <g transform="translate(150, 0)">
          <!-- M (Bright Red) -->
          <path d="M 0,100 L 8,20 L 22,18 L 36,60 L 50,18 L 64,20 L 58,100 L 44,100 L 48,50 L 36,82 L 26,82 L 14,50 L 16,100 Z" fill="#E50914" />

          <!-- U (Dark Navy/Black) -->
          <path d="M 74,22 L 92,20 L 88,70 C 86,84 92,92 102,90 C 112,88 116,82 118,68 L 122,22 L 140,20 L 134,70 C 130,94 116,104 98,104 C 80,104 70,92 74,22 Z" fill="#0a2540" />

          <!-- R (Dark Navy/Black) -->
          <path d="M 150,20 L 182,18 C 200,18 210,26 208,42 C 206,56 198,64 186,68 L 210,100 L 192,100 L 172,70 L 166,70 L 162,100 L 146,100 Z M 166,56 L 180,56 C 188,56 192,52 192,44 C 192,36 188,32 180,32 L 166,32 Z" fill="#0a2540" />

          <!-- U (Dark Navy/Black) -->
          <path d="M 220,22 L 238,20 L 234,70 C 232,84 238,92 248,90 C 258,88 262,82 264,68 L 268,22 L 286,20 L 280,70 C 276,94 262,104 244,104 C 226,104 216,92 220,22 Z" fill="#0a2540" />

          <!-- G (Dark Navy/Black) -->
          <path d="M 340,32 L 324,40 C 320,28 310,24 302,28 C 294,34 290,70 298,88 C 304,96 314,96 322,90 L 322,70 L 308,70 L 308,56 L 340,56 L 340,96 C 328,106 306,108 292,98 C 276,84 274,40 290,20 C 304,4 328,10 340,32 Z" fill="#0a2540" />

          <!-- A (Dark Navy/Black) -->
          <path d="M 358,100 L 376,18 L 394,18 L 412,100 L 396,100 L 392,80 L 376,80 L 374,100 Z M 380,66 L 388,66 L 384,38 Z" fill="#0a2540" />
        </g>
      </g>

      <!-- Bottom Subtitle: HOLIDAYS -->
      <g transform="translate(240, 142)">
        <text x="0" y="0" class="brand-sub" font-size="24" fill="#0a2540">HOLIDAYS</text>
      </g>
    </g>
  </g>
</svg>
