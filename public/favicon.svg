    <path d="M 65,124 C 65,144 44,144 44,128" stroke="#FF4500" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Group of Gowda's text -->
    <text x="65" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10.5" letter-spacing="1.2" fill="#FF4500">GROUP OF GOWDA'S</text>
  </g>
</svg>